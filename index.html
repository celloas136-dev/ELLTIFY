<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Elltify">
  <link rel="manifest" href="manifest.json">
  <title>Elltify - Music Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    *{margin:0;padding:0;font-family:'Montserrat',sans-serif;box-sizing:border-box;color:white}
    body{background:#000;overflow:hidden;height:100vh}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:#111}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
    ::-webkit-scrollbar-thumb:hover{background:#555}

    /* ===== AUTH OVERLAY ===== */
    .auth-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:radial-gradient(ellipse at 50% 50%,#0a1628 0%,#000 70%);display:flex;justify-content:center;align-items:center;z-index:1000;transition:opacity .3s;overflow:hidden}
    .auth-overlay.hidden{opacity:0;pointer-events:none}
    .auth-box-wrapper{padding:3px;border-radius:16px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);box-shadow:0 10px 40px rgba(0,110,255,.4);position:relative;z-index:2}
    .auth-box{background:#0c0c0c;padding:40px;border-radius:13px;width:380px;display:flex;flex-direction:column;align-items:center;animation:authSlideIn .5s ease}
    @keyframes authSlideIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

    /* Logo */
    .elltify-logo{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#0a0a0a 60%,#111);position:relative;margin-bottom:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(0,210,255,.5),0 0 30px rgba(58,123,213,.4);overflow:hidden;animation:logoPulse 3s ease-in-out infinite}
    @keyframes logoPulse{0%,100%{box-shadow:0 0 0 3px rgba(0,210,255,.5),0 0 25px rgba(58,123,213,.4)}50%{box-shadow:0 0 0 6px rgba(0,210,255,.3),0 0 45px rgba(58,123,213,.7)}}
    .elltify-logo svg{width:54px;height:54px;filter:drop-shadow(0 0 8px rgba(0,210,255,.7))}
    .elltify-logo-sm{width:55px;height:55px;margin-bottom:14px;animation:logoPulse 3s ease-in-out infinite}
    .elltify-logo-sm svg{width:32px;height:32px}

    /* Auth Text */
    .auth-welcome-title{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center;background:linear-gradient(135deg,#00d2ff,#3a7bd5,#1db954,#00d2ff);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 4s ease infinite}
    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .auth-welcome-sub{font-size:11px;color:#727272;text-align:center;margin-bottom:24px;line-height:1.5}
    .auth-title{font-size:18px;font-weight:700;margin-bottom:20px;text-align:center}

    /* Auth Inputs */
    .auth-input-group{width:100%;margin-bottom:10px;position:relative}
    .auth-input{width:100%;background:#181818;border:1px solid #2a2a2a;border-radius:10px;padding:12px 40px;font-size:13px;color:white;outline:none;transition:.2s}
    .auth-input:focus{border-color:#3a7bd5;background:#1e1e1e;box-shadow:0 0 0 3px rgba(58,123,213,.1)}
    .auth-input.input-error{border-color:#e91429;box-shadow:0 0 0 3px rgba(233,20,41,.1)}
    .auth-input.input-success{border-color:#1db954;box-shadow:0 0 0 3px rgba(29,185,84,.1)}
    .auth-input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#555;font-size:13px;pointer-events:none}
    .pwd-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#555;font-size:13px;cursor:pointer;z-index:2;transition:.2s}
    .pwd-toggle:hover{color:#1db954}
    .input-hint{font-size:10px;margin-top:4px;padding-left:4px;display:none}
    .input-hint.visible{display:block}
    .input-hint.error{color:#e91429}
    .input-hint.success{color:#1db954}
    .pwd-hint{font-size:9px;color:#535353;margin-top:-6px;margin-bottom:10px;padding-left:4px}

    /* Auth Buttons */
    .auth-btn-primary{width:100%;background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;border:none;border-radius:25px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
    .auth-btn-primary::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%);transition:width .6s,height .6s}
    .auth-btn-primary:hover::after{width:400px;height:400px}
    .auth-btn-primary:hover{transform:scale(1.02);box-shadow:0 6px 25px rgba(0,210,255,.35)}
    .auth-btn-google{width:100%;background:#fff;color:#333;border:none;border-radius:25px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
    .auth-btn-google:hover{transform:scale(1.02);box-shadow:0 4px 15px rgba(255,255,255,.2)}
    .auth-btn-google img{width:18px;height:18px}
    .auth-btn-outline{width:100%;background:transparent;color:#fff;border:2px solid rgba(0,210,255,.3);border-radius:25px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
    .auth-btn-outline:hover{border-color:#00d2ff;background:rgba(0,210,255,.06);transform:scale(1.02)}
    .auth-back{margin-top:14px;font-size:11px;color:#535353;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;transition:.2s}
    .auth-back:hover{color:#00d2ff}
    .auth-divider{display:flex;align-items:center;gap:10px;margin:10px 0;width:100%}
    .auth-divider span{font-size:10px;color:#535353;white-space:nowrap}
    .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#2a2a2a}
    .auth-error{color:#e91429;font-size:11px;margin-bottom:10px;text-align:center;display:none;background:rgba(233,20,41,.08);padding:8px 12px;border-radius:8px;width:100%;border:1px solid rgba(233,20,41,.2)}
    .auth-banned{color:#e91429;font-size:12px;text-align:center;background:rgba(233,20,41,.1);padding:12px;border-radius:10px;border:1px solid rgba(233,20,41,.3);margin-bottom:12px;display:none}

    /* Auth Animations Background */
    .auth-particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
    .auth-particle{position:absolute;border-radius:50%;animation:floatParticle linear infinite}
    .auth-particle.p-blue{background:radial-gradient(circle,rgba(0,210,255,.15),transparent 70%)}
    .auth-particle.p-green{background:radial-gradient(circle,rgba(29,185,84,.1),transparent 70%)}
    .auth-particle.p-purple{background:radial-gradient(circle,rgba(107,63,160,.12),transparent 70%)}
    @keyframes floatParticle{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}
    .auth-notes{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
    .auth-note{position:absolute;animation:floatNote linear infinite}
    @keyframes floatNote{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.12}50%{opacity:.18}90%{opacity:.1}100%{transform:translateY(-50px) rotate(360deg);opacity:0}}
    .auth-glow-ring{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(0,210,255,.06) 0%,transparent 70%);animation:pulseGlow 4s ease-in-out infinite;pointer-events:none;z-index:0}
    @keyframes pulseGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.4);opacity:.9}}
    .auth-waves{position:absolute;bottom:0;left:0;width:100%;height:100px;pointer-events:none;z-index:0;overflow:hidden}
    .auth-wave{position:absolute;bottom:0;width:200%;height:100%;animation:waveMove linear infinite}
    .auth-wave:nth-child(1){opacity:.04;animation-duration:8s}
    .auth-wave:nth-child(2){opacity:.025;animation-duration:12s;animation-delay:1s}
    .auth-wave:nth-child(3){opacity:.015;animation-duration:16s;animation-delay:2s}
    @keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .auth-artists-bg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0}
    .auth-artist-bubble{position:absolute;border-radius:50%;overflow:hidden;animation:floatBubble ease-in-out infinite}
    .auth-artist-bubble img{width:100%;height:100%;object-fit:cover}
    @keyframes floatBubble{0%,100%{transform:translateY(0) scale(1);opacity:.1}50%{transform:translateY(-18px) scale(1.06);opacity:.18}}

    /* ===== MAIN LAYOUT ===== */
    .main-container{display:flex;height:calc(100vh - 75px);padding:6px;gap:6px}

    /* ===== SIDEBAR ===== */
    .sidebar{width:240px;background:#000;display:flex;flex-direction:column;gap:6px;font-size:11px;height:100%;flex-shrink:0}
    .sidebar-logo{background:#111;border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:10px}
    .sidebar-logo-icon{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#0a0a0a 60%,#111);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(0,210,255,.4);flex-shrink:0}
    .sidebar-logo-icon svg{width:18px;height:18px}
    .sidebar-logo-text{font-size:15px;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
    .nav-links{background:#111;border-radius:8px;padding:14px}
    .nav-links a{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;opacity:.6;font-size:12px;transition:.2s;cursor:pointer;margin-bottom:10px;padding:6px 8px;border-radius:8px}
    .nav-links a:last-child{margin-bottom:0}
    .nav-links a:hover{opacity:1;background:rgba(255,255,255,.04)}
    .nav-links a.active{opacity:1;color:#1db954;background:rgba(29,185,84,.08)}
    .nav-links a.logout-btn:hover{color:#e91429;background:rgba(233,20,41,.08)}
    .nav-links a.admin-link{color:#00d2ff;opacity:.8}
    .nav-links a.admin-link:hover{opacity:1}
    .admin-badge-nav{background:#e91429;color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:8px;margin-left:auto;animation:badgePulse 2s infinite}
    @keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    .library{flex-grow:1;background:#111;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
    .library-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;border-bottom:1px solid #1f1f1f;padding-bottom:8px;opacity:.8}
    .playlist-box{background:linear-gradient(135deg,#1a1a1a,#111);padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,.04)}
    .box-p1{font-weight:700;font-size:12px;margin-bottom:4px}
    .box-p2{font-size:10px;color:#727272;margin-bottom:10px;line-height:1.4}
    .badge{background:#fff;color:#000;border:none;border-radius:20px;padding:6px 14px;font-weight:700;font-size:10px;cursor:pointer;transition:.2s;margin-right:6px;margin-bottom:4px}
    .badge:hover{transform:scale(1.05);background:#1db954;color:white}
    .badge-blue{background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff}
    .playlist-list-sidebar{display:flex;flex-direction:column;gap:4px}
    .playlist-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:.2s;border:1px solid transparent;position:relative}
    .playlist-item:hover{background:#1a1a1a}
    .playlist-item.active-folder{background:#1a2e1a;border-color:rgba(29,185,84,.3)}
    .playlist-icon-box{width:36px;height:36px;background:#242424;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#1db954;flex-shrink:0}
    .playlist-info-text{flex-grow:1;overflow:hidden}
    .playlist-info-text h4{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .playlist-info-text p{font-size:9px;color:#727272;margin-top:2px}
    .delete-playlist-btn{background:none;border:none;color:#535353;cursor:pointer;font-size:11px;position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;transition:.2s}
    .playlist-item:hover .delete-playlist-btn{opacity:1}
    .delete-playlist-btn:hover{color:#e91429}
    .firebase-status{font-size:9px;padding:3px 8px;border-radius:10px;font-weight:600;transition:.3s}
    .firebase-status.connected{background:rgba(29,185,84,.12);color:#1db954}
    .firebase-status.disconnected{background:rgba(233,20,41,.12);color:#e91429}

    /* ===== MAIN CONTENT ===== */
    .main-content{flex-grow:1;background:#111;border-radius:8px;padding:16px;overflow-y:auto;display:flex;flex-direction:column;position:relative}
    .dynamic-bg{position:absolute;top:0;left:0;width:100%;height:100%;opacity:.06;transition:background 2s ease;pointer-events:none;border-radius:8px;z-index:0}
    .main-content-inner{position:relative;z-index:1}
    .header{display:flex;align-items:center;gap:10px;background:rgba(17,17,17,.9);position:sticky;top:0;z-index:5;padding-bottom:10px;backdrop-filter:blur(10px)}
    .search-container{position:relative;flex-grow:1;max-width:260px}
    .search-container i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#535353;font-size:12px}
    .search-input{width:100%;background:#1a1a1a;border:1px solid transparent;border-radius:20px;padding:8px 14px 8px 34px;font-size:11px;color:white;outline:none;transition:.2s}
    .search-input:focus{background:#222;border-color:#333}
    .user-profile-badge{display:flex;align-items:center;gap:8px;margin-left:auto;background:#1a1a1a;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s}
    .user-profile-badge:hover{background:#222}
    .user-profile-badge i{color:#1db954}
    .user-level-badge{font-size:9px;background:rgba(0,210,255,.15);color:#00d2ff;padding:2px 7px;border-radius:8px;font-weight:700}
    .user-admin-tag{font-size:8px;color:#00d2ff;background:rgba(0,210,255,.12);padding:2px 6px;border-radius:6px;font-weight:700}
    .header-action-btn{background:none;border:none;color:#535353;cursor:pointer;font-size:15px;transition:.2s;padding:6px;border-radius:8px;position:relative}
    .header-action-btn:hover{color:#1db954;background:rgba(29,185,84,.08)}
    .header-action-btn.active-ctrl{color:#1db954}
    .header-timer-text{font-size:9px;color:#1db954;font-weight:700;margin-left:1px}
    .header-timer-text.urgent{color:#e91429;animation:urgentPulse 1s infinite}
    @keyframes urgentPulse{0%,100%{opacity:1}50%{opacity:.3}}
    .notif-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;background:#e91429;border-radius:50%;border:2px solid #111;animation:badgePulse 2s infinite}

    /* ===== SECTION TITLES ===== */
    .section-title{font-size:14px;font-weight:700;margin-bottom:12px;margin-top:6px;display:flex;align-items:center;gap:8px}
    .section-title i{color:#1db954;font-size:12px}
    .section-divider-line{border:none;border-top:1px solid #1a1a1a;margin:14px 0}
    .back-to-home{font-size:10px;color:#1db954;cursor:pointer;font-weight:600;margin-left:auto;background:rgba(29,185,84,.08);padding:4px 10px;border-radius:10px;transition:.2s}
    .back-to-home:hover{background:rgba(29,185,84,.15)}

    /* ===== ARTIST CARDS ===== */
    .artist-cards-row{display:flex;gap:10px;margin-bottom:6px;overflow-x:auto;padding-bottom:6px}
    .artist-cards-row::-webkit-scrollbar{height:0}
    .artist-card{min-width:110px;width:110px;background:#1a1a1a;padding:10px;border-radius:12px;cursor:pointer;transition:.3s;text-align:center;border:1px solid transparent;flex-shrink:0;position:relative}
    .artist-card:hover{background:#222;transform:translateY(-4px);border-color:rgba(29,185,84,.2);box-shadow:0 8px 25px rgba(0,0,0,.4)}
    .artist-card-img{width:66px;height:66px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.05)}
    .artist-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
    .artist-card:hover .artist-card-img img{transform:scale(1.12)}
    .artist-card-name{font-weight:700;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
    .artist-card-count{font-size:8px;color:#535353}
    .artist-card-moods{font-size:9px;margin-top:4px;letter-spacing:1px}
    .artist-follow-btn{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:2px 6px;font-size:8px;cursor:pointer;transition:.2s;color:#a7a7a7}
    .artist-follow-btn:hover{border-color:#1db954;color:#1db954}
    .artist-follow-btn.following{border-color:#1db954;color:#1db954;background:rgba(29,185,84,.1)}

    /* ===== ARTIST BLOCK ===== */
    .artist-block{margin-bottom:12px;padding:12px 14px;background:#161616;border-radius:12px;border:1px solid rgba(255,255,255,.03);transition:.3s}
    .artist-block:hover{border-color:rgba(29,185,84,.12);background:#1a1a1a}
    .artist-block.glow-highlight{border-color:#1db954;box-shadow:0 0 20px rgba(29,185,84,.2);background:#1a2e1a}
    .artist-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #1f1f1f}
    .artist-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.05)}
    .artist-avatar img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
    .artist-block:hover .artist-avatar img{transform:scale(1.1)}
    .artist-name-text{font-size:13px;font-weight:700;flex-grow:1}
    .artist-song-count{font-size:9px;color:#535353}
    .artist-songs-list{display:flex;flex-direction:column;gap:4px}

    /* ===== MOOD ===== */
    .mood-thumb{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;margin-right:10px;flex-shrink:0}
    .mood-thumb-sm{width:26px;height:26px;font-size:11px;margin-right:8px}
    .mood-filter-section{margin-bottom:14px}
    .mood-filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
    .mood-filter-row::-webkit-scrollbar{height:0}
    .mood-filter-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:25px;cursor:pointer;transition:.25s;border:1px solid rgba(255,255,255,.06);white-space:nowrap;flex-shrink:0;font-size:10px;font-weight:700}
    .mood-filter-chip:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .mood-filter-chip.active-mood{border-color:#1db954;box-shadow:0 0 15px rgba(29,185,84,.25);transform:translateY(-2px)}

    /* ===== OVAL CAPSULES ===== */
    .oval-home-capsule{display:flex;align-items:center;background:#1a1a1a;padding:7px 14px;border-radius:30px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,.03);margin-bottom:4px}
    .oval-home-capsule:hover{background:#222;border-color:rgba(255,255,255,.08)}
    .oval-home-capsule.playing-oval{border-color:rgba(29,185,84,.4);background:rgba(29,185,84,.06)}
    .oval-home-capsule.playing-oval .oval-home-title{color:#1db954}
    .oval-home-details{flex-grow:1;display:flex;flex-direction:column;overflow:hidden}
    .oval-home-title{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .oval-home-artist{font-size:10px;color:#727272;margin-top:1px}
    .oval-home-added-by{font-size:9px;color:#00d2ff;margin-left:auto;white-space:nowrap;flex-shrink:0;padding:2px 8px;background:rgba(0,210,255,.06);border-radius:8px;margin-right:8px}
    .oval-home-btns{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:6px}
    .oval-home-btn{background:none;border:none;color:#535353;cursor:pointer;font-size:12px;transition:.2s;padding:5px;border-radius:6px}
    .oval-home-btn:hover{color:#1db954;background:rgba(29,185,84,.08)}
    .oval-home-btn.active-fav{color:#e91429}

    /* ===== PLAYLIST VIEW ===== */
    .playlist-view-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
    .oval-playlist-container{display:flex;flex-direction:column;gap:6px}
    .oval-track-capsule{display:flex;align-items:center;background:#1a1a1a;padding:8px 16px;border-radius:25px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,.03)}
    .oval-track-capsule:hover{background:#222}
    .oval-track-capsule.playing-oval{border-color:rgba(29,185,84,.4);background:rgba(29,185,84,.06)}
    .oval-thumb{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:12px;flex-shrink:0}
    .oval-details{flex-grow:1;display:flex;flex-direction:column}
    .oval-title{font-weight:700;font-size:12px}
    .oval-artist{font-size:10px;color:#727272;margin-top:1px}
    .oval-action-btn{background:none;border:none;color:#535353;cursor:pointer;font-size:13px;margin-left:10px;padding:4px;transition:.2s}
    .oval-action-btn:hover{color:#e91429}
    .empty-playlist-text{font-size:11px;color:#535353;font-style:italic;padding:20px;text-align:center}

    /* ===== SIDEBAR CONTRIB ===== */
    .sidebar-section-label{font-size:9px;font-weight:700;color:#00d2ff;letter-spacing:.5px;margin-top:6px;margin-bottom:4px;padding:5px 8px;background:rgba(0,210,255,.05);border-radius:6px;display:flex;align-items:center;gap:6px;border-left:2px solid #00d2ff}
    .contributed-song-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:.2s;border:1px solid transparent;position:relative}
    .contributed-song-item:hover{background:#1a1a1a}
    .contributed-song-item.playing-contrib{border-color:rgba(29,185,84,.3);background:rgba(29,185,84,.06)}
    .contrib-info{flex-grow:1;overflow:hidden}
    .contrib-info h4{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .contrib-info p{font-size:8px;color:#535353;margin-top:1px}
    .contrib-delete-btn{background:none;border:none;color:#535353;cursor:pointer;font-size:10px;opacity:0;transition:.2s;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
    .contributed-song-item:hover .contrib-delete-btn{opacity:1}
    .contrib-delete-btn:hover{color:#e91429}

    /* ===== RIGHT PANEL ===== */
    .ads-sidebar{width:200px;background:#111;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;height:100%;overflow-y:auto}
    .right-panel-tools{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
    .right-tool-card{background:#1a1a1a;border:1px solid rgba(255,255,255,.05);border-radius:25px;padding:10px 16px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:10px}
    .right-tool-card:hover{border-color:rgba(0,210,255,.25);background:#1e1e1e;transform:translateX(-2px)}
    .right-tool-icon{font-size:16px;flex-shrink:0}
    .right-tool-title{font-size:10px;font-weight:700;flex-grow:1}
    .right-tool-meta{font-size:8px;color:#1db954;margin-left:auto}
    .right-panel-timer{display:none;flex-direction:column}
    .right-panel-timer.active{display:flex}
    .timer-page-back{font-size:11px;color:#00d2ff;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;gap:6px;transition:.2s}
    .timer-page-back:hover{color:#fff}
    .timer-page-title{font-size:13px;font-weight:700;text-align:center;margin-bottom:10px}
    .timer-page-status{text-align:center;font-size:10px;color:#535353;margin-bottom:10px}
    .timer-options-mini{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
    .timer-opt-mini{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:10px;font-weight:600;transition:.2s}
    .timer-opt-mini:hover{border-color:#1db954;background:rgba(29,185,84,.08)}
    .timer-custom-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;justify-content:center}
    .timer-custom-input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:8px;font-size:11px;color:#fff;text-align:center;width:60px;outline:none}
    .timer-custom-input:focus{border-color:#00d2ff}
    .ads-divider{border:none;border-top:1px solid #1f1f1f;margin:4px 0}
    .ads-header{font-size:9px;font-weight:700;color:#535353;letter-spacing:1px;text-transform:uppercase;padding-bottom:6px}
    .ads-slot{background:#1a1a1a;border-radius:8px;border:1px dashed #2a2a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;gap:8px}
    .ads-dummy-image{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#1f1f1f,#2a2a2a);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#535353}
    .ads-text-title{font-size:10px;font-weight:700;color:#727272}
    .ads-text-desc{font-size:8px;color:#535353}
    .ads-inline{display:none;background:#1a1a1a;border:1px dashed #2a2a2a;border-radius:8px;padding:10px;text-align:center;margin:10px 0}

    /* ===== PLAYER BAR ===== */
    .player-bar{position:fixed;bottom:0;left:0;width:100%;height:75px;background:rgba(0,0,0,.95);display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-top:1px solid #1a1a1a;z-index:10;backdrop-filter:blur(20px)}
    .player-bar-left{display:flex;align-items:center;gap:10px;width:25%;min-width:160px}
    .album-cover-mock{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;transition:transform .3s}
    .album-cover-mock.playing-pulse{animation:albumPulse 2s ease-in-out infinite}
    @keyframes albumPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    .album-text{overflow:hidden}
    .album-text h4{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .album-text p{font-size:10px;color:#727272;margin-top:1px}
    .player-bar-center{display:flex;flex-direction:column;align-items:center;gap:3px;width:50%}
    .player-bar-lyrics{font-size:10px;color:#727272;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;text-align:center;height:14px}
    .player-bar-lyrics .lyric-active{color:#fff;font-weight:700}
    .control-buttons{display:flex;gap:12px;align-items:center;font-size:13px;color:#727272}
    .control-buttons i{cursor:pointer;transition:.15s;padding:4px;border-radius:6px}
    .control-buttons i:hover{color:white;transform:scale(1.1)}
    .control-buttons i.active-ctrl{color:#1db954}
    .play-icon{font-size:24px;color:white!important}
    .playback-bar{display:flex;align-items:center;gap:8px;font-size:10px;color:#727272;width:100%;max-width:420px}
    .progress-bar{width:100%;accent-color:#1db954;cursor:pointer;height:3px}
    .player-bar-right{display:flex;gap:10px;align-items:center;width:25%;justify-content:flex-end;color:#727272;font-size:12px}
    .volume-bar{width:70px;accent-color:#1db954;height:3px}
    .player-bar-right i{cursor:pointer;transition:.2s;padding:4px}
    .player-bar-right i:hover{color:#1db954}
    .player-bar-right i.active-ctrl{color:#1db954}
    .eq-mini{display:flex;gap:2px;align-items:flex-end;height:20px;margin:0 6px}
    .eq-mini-bar{width:3px;background:linear-gradient(to top,#1db954,#00d2ff);border-radius:1px;transition:height .12s}
    .buffer-info{font-size:9px;color:#535353;text-align:center;display:none}

    /* ===== LYRIC OVERLAY ===== */
    .lyric-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:50;display:none;flex-direction:column;opacity:0;transition:opacity .3s}
    .lyric-overlay.active{display:flex;opacity:1}
    .lyric-bg{position:absolute;top:0;left:0;width:100%;height:100%;opacity:.08;transition:background 2s ease;pointer-events:none}
    .lyric-header{padding:14px 18px;display:flex;align-items:center;position:relative;z-index:2}
    .lyric-back{background:none;border:none;color:#727272;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;transition:.2s}
    .lyric-back:hover{color:#fff}
    .lyric-body{flex-grow:1;overflow-y:auto;padding:20px 30px 80px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
    .lyric-line{font-size:17px;color:#333;margin:8px 0;text-align:center;transition:all .35s;font-weight:500;cursor:pointer}
    .lyric-line:hover{color:#555}
    .lyric-line.active{color:#fff;font-size:22px;font-weight:800;text-shadow:0 0 30px rgba(255,255,255,.15)}
    .lyric-line.past{color:#2a2a2a}
    .lyric-artist-badge{position:absolute;bottom:20px;right:24px;text-align:center}
    .lyric-artist-img{width:52px;height:52px;border-radius:50%;overflow:hidden;margin:0 auto 6px;border:2px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:20px}
    .lyric-artist-img img{width:100%;height:100%;object-fit:cover}
    .lyric-artist-name{font-size:11px;font-weight:700;color:#727272;text-align:center}
    .eq-lyric{display:flex;gap:3px;align-items:flex-end;height:36px;justify-content:center;margin:16px 0 8px;position:relative;z-index:2}
    .eq-lyric-bar{width:4px;background:linear-gradient(to top,#1db954,#00d2ff);border-radius:2px;transition:height .12s}
    .lyric-controls{padding:14px 20px;background:rgba(0,0,0,.6);border-top:1px solid #1a1a1a;backdrop-filter:blur(10px);position:relative;z-index:2}
    .lyric-progress{display:flex;align-items:center;gap:8px;font-size:10px;color:#727272;margin-bottom:10px}
    .lyric-progress input{flex-grow:1;accent-color:#1db954;height:3px}
    .lyric-ctrl-row{display:flex;justify-content:center;gap:20px;align-items:center;margin-bottom:8px}
    .lyric-ctrl-row i{font-size:16px;color:#727272;cursor:pointer;transition:.2s;padding:6px}
    .lyric-ctrl-row i:hover{color:#fff}
    .lyric-ctrl-row i.active-ctrl{color:#1db954}
    .lyric-ctrl-row .lyric-play-icon{font-size:30px;color:#fff!important}
    .lyric-volume-row{display:flex;justify-content:center;align-items:center;gap:8px}
    .lyric-volume-row i{font-size:12px;color:#727272}
    .lyric-volume-row input{width:100px;accent-color:#1db954;height:3px}

    /* ===== TOP CHARTS ===== */
    .top-chart-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;transition:.2s;cursor:pointer}
    .top-chart-item:hover{background:#1a1a1a}
    .top-chart-rank{font-size:13px;font-weight:800;width:24px;text-align:center;flex-shrink:0}
    .top-chart-rank.gold{color:#ffd700}
    .top-chart-rank.silver{color:#c0c0c0}
    .top-chart-rank.bronze{color:#cd7f32}
    .top-chart-info{flex-grow:1;overflow:hidden}
    .top-chart-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-chart-artist{font-size:9px;color:#727272}
    .top-chart-count{font-size:9px;color:#535353;flex-shrink:0}
    .top-chart-bar{width:50px;height:3px;background:#1f1f1f;border-radius:2px;overflow:hidden;flex-shrink:0}
    .top-chart-bar-fill{height:100%;background:linear-gradient(90deg,#1db954,#00d2ff);border-radius:2px}

    /* ===== COMMENTS ===== */
    .comment-section{margin-top:14px;padding:14px;background:#161616;border-radius:12px;border:1px solid rgba(255,255,255,.04)}
    .comment-title{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .comment-title i{color:#00d2ff;font-size:11px}
    .comment-list{max-height:180px;overflow-y:auto;margin-bottom:10px}
    .comment-item{padding:8px;border-bottom:1px solid #1f1f1f;display:flex;gap:8px}
    .comment-item:last-child{border-bottom:none}
    .comment-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#333,#555);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-weight:700}
    .comment-body{flex-grow:1}
    .comment-user{font-size:10px;font-weight:700;color:#a7a7a7}
    .comment-time{font-size:8px;color:#535353;margin-left:6px}
    .comment-text{font-size:11px;margin-top:3px;color:#d4d4d4;line-height:1.4}
    .comment-input-row{display:flex;gap:8px}
    .comment-input{flex-grow:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:8px 14px;font-size:11px;color:#fff;outline:none;transition:.2s}
    .comment-input:focus{border-color:#00d2ff}
    .comment-send{background:linear-gradient(135deg,#00d2ff,#3a7bd5);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#fff;flex-shrink:0;transition:.2s}
    .comment-send:hover{transform:scale(1.1)}
    .comment-cooldown{font-size:9px;color:#535353;text-align:center;margin-top:4px;display:none}

    /* ===== MODALS ===== */
    .modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .playlist-modal{background:#0d0d0d;width:440px;max-height:88vh;overflow-y:auto;padding:24px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.06);transform:scale(.85);transition:transform .3s}
    .modal-overlay.active .playlist-modal{transform:scale(1)}
    .modal-title{font-size:14px;font-weight:700;margin-bottom:16px;text-align:center}
    .modal-input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:10px 18px;font-size:12px;color:#fff;outline:none;margin-bottom:10px;text-align:center;transition:.2s}
    .modal-input:focus{border-color:#3a7bd5;background:#1e1e1e}
    .modal-input.left-align{text-align:left}
    select.modal-input{cursor:pointer;appearance:auto}
    .modal-buttons{display:flex;justify-content:center;gap:10px}
    .modal-btn{border:none;border-radius:20px;padding:9px 22px;font-size:11px;font-weight:700;cursor:pointer;transition:.2s}
    .btn-cancel{background:#1f1f1f;color:#fff}
    .btn-cancel:hover{background:#2a2a2a}
    .btn-submit{background:linear-gradient(135deg,#0052d4,#4364f7);color:#fff}
    .btn-submit:hover{transform:scale(1.03);box-shadow:0 4px 15px rgba(67,100,247,.4)}
    .btn-submit:disabled{opacity:.4;cursor:not-allowed}
    .btn-danger{background:linear-gradient(135deg,#e91429,#a80f1d);color:#fff}
    .btn-danger:hover{transform:scale(1.03)}
    .btn-success{background:linear-gradient(135deg,#1db954,#14833b);color:#fff}
    .btn-success:hover{transform:scale(1.03)}
    .contrib-modal-section{margin-bottom:14px}
    .contrib-modal-label{font-size:11px;font-weight:600;color:#727272;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .contrib-modal-label i{color:#00d2ff;font-size:10px}
    .upload-area{border:2px dashed #2a2a2a;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:.3s;background:#0f0f0f;position:relative;margin-bottom:12px}
    .upload-area:hover,.upload-area.dragover{border-color:#00d2ff;background:rgba(0,210,255,.04)}
    .upload-area.has-file{border-color:#1db954;background:rgba(29,185,84,.04)}
    .upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
    .upload-icon{font-size:28px;color:#333;margin-bottom:8px;transition:.3s}
    .upload-area:hover .upload-icon{color:#00d2ff}
    .upload-area.has-file .upload-icon{color:#1db954}
    .upload-text{font-size:12px;color:#535353;margin-bottom:4px}
    .upload-subtext{font-size:10px;color:#333}
    .upload-progress-wrap{margin-bottom:14px;display:none}
    .upload-progress-label{font-size:10px;color:#727272;margin-bottom:6px;display:flex;justify-content:space-between}
    .upload-progress-bar-bg{background:#1f1f1f;border-radius:10px;height:6px;overflow:hidden}
    .upload-progress-bar-fill{height:100%;background:linear-gradient(90deg,#00d2ff,#1db954);border-radius:10px;width:0%;transition:width .3s}
    .upload-status-text{font-size:10px;color:#00d2ff;text-align:center;margin-top:6px}
    .or-divider{display:flex;align-items:center;gap:10px;margin:8px 0}
    .or-divider span{font-size:10px;color:#535353;white-space:nowrap}
    .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:#1f1f1f}
    .batch-file-list{max-height:180px;overflow-y:auto;margin-bottom:10px}
    .batch-file-item{background:#161616;border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:10px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
    .batch-file-info{flex-grow:1;overflow:hidden}
    .batch-file-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .batch-file-size{font-size:9px;color:#535353}
    .batch-file-remove{background:none;border:none;color:#535353;cursor:pointer;font-size:12px;transition:.2s}
    .batch-file-remove:hover{color:#e91429}

    /* ===== ADMIN ===== */
    .admin-panel{display:none;flex-direction:column}
    .admin-panel-header{text-align:center;padding:20px;background:linear-gradient(135deg,rgba(0,0,0,.9),rgba(0,20,50,.7));border:1px solid rgba(0,210,255,.12);border-radius:14px;margin-bottom:14px}
    .admin-panel-title{font-size:20px;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .admin-panel-subtitle{font-size:10px;color:#535353;margin-top:4px}
    .admin-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .admin-tab{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:6px 14px;font-size:10px;font-weight:700;color:#727272;cursor:pointer;transition:.2s;position:relative}
    .admin-tab:hover{background:#222;color:#fff}
    .admin-tab.active{background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;border-color:transparent}
    .admin-tab .tab-badge{position:absolute;top:-4px;right:-4px;background:#e91429;color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:8px;animation:badgePulse 2s infinite}
    .admin-tab-content{display:none}
    .admin-tab-content.active{display:block}
    .admin-card{background:#161616;border:1px solid rgba(255,255,255,.04);border-radius:12px;padding:14px;margin-bottom:10px;transition:.2s}
    .admin-card:hover{border-color:rgba(0,210,255,.12)}
    .admin-card-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
    .admin-card-row i{color:#00d2ff;font-size:10px;width:14px;flex-shrink:0}
    .admin-card-row .label{color:#535353;min-width:70px}
    .admin-card-row .value{color:#fff;font-weight:600}
    .admin-card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .admin-card-actions .modal-btn{padding:6px 14px;font-size:10px}
    .admin-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
    .admin-stat-box{background:#1a1a1a;border:1px solid rgba(255,255,255,.04);border-radius:12px;padding:14px;text-align:center}
    .admin-stat-num{font-size:22px;font-weight:800;background:linear-gradient(135deg,#00d2ff,#1db954);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .admin-stat-label{font-size:9px;color:#535353;margin-top:4px}
    .admin-search{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:8px 14px;font-size:11px;color:#fff;outline:none;margin-bottom:10px;transition:.2s}
    .admin-search:focus{border-color:#00d2ff}
    .admin-empty{font-size:11px;color:#535353;font-style:italic;padding:20px;text-align:center}
    .review-player{background:#0f0f0f;border-radius:10px;padding:10px;margin:8px 0;display:flex;align-items:center;gap:10px}
    .review-play-btn{background:linear-gradient(135deg,#1db954,#14833b);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#fff;flex-shrink:0;transition:.2s}
    .review-play-btn:hover{transform:scale(1.1)}
    .review-progress{flex-grow:1}
    .review-progress input[type=range]{width:100%;accent-color:#1db954;height:3px}
    .review-time{font-size:9px;color:#535353;display:flex;justify-content:space-between}
    .status-badge{font-size:9px;padding:3px 8px;border-radius:8px;font-weight:700}
    .status-active{background:rgba(29,185,84,.12);color:#1db954}
    .status-banned{background:rgba(233,20,41,.12);color:#e91429}
    .status-pending{background:rgba(245,155,0,.12);color:#f59b00}
    .mood-picker{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

    // ===== LYRICS FETCH (lrclib.net) =====
    function parseLRC(lrcText){
        if(!lrcText)return[];
        var lines=lrcText.split('\n'),result=[];
        for(var i=0;i<lines.length;i++){
            var line=lines[i].trim();
            var match=line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]\s*(.*)/);
            if(match){
                var min=parseInt(match[1]),sec=parseInt(match[2]),ms=parseInt(match[3]);
                var text=match[4].trim();
                if(text){
                    var totalSec=min*60+sec+ms/(match[3].length===3?1000:100);
                    result.push({t:totalSec,x:text});
                }
            }
        }
        return result;
    }

    function fetchLyrics(title,artist,callback){
        var url='https://lrclib.net/api/search?track_name='+encodeURIComponent(title)+'&artist_name='+encodeURIComponent(artist);
        fetch(url)
        .then(function(res){return res.json();})
        .then(function(data){
            if(!data||!data.length){callback({found:false});return;}
            var best=null;
            for(var i=0;i<data.length;i++){if(data[i].syncedLyrics){best=data[i];break;}}
            if(!best){for(var i=0;i<data.length;i++){if(data[i].plainLyrics){best=data[i];break;}}}
            if(!best){callback({found:false});return;}
            if(best.syncedLyrics){
                var lines=parseLRC(best.syncedLyrics);
                callback({found:true,synced:true,lines:lines,source:'lrclib',count:lines.length});
            }else if(best.plainLyrics){
                var plainLines=best.plainLyrics.split('\n').filter(function(l){return l.trim();}).map(function(l,idx){return{t:idx*4,x:l.trim()};});
                callback({found:true,synced:false,lines:plainLines,source:'lrclib',count:plainLines.length});
            }else{callback({found:false});}
        })
        .catch(function(){callback({found:false});});
    }

    function ensureStats(){if(!currentUser)return;if(!userStats[currentUser])userStats[currentUser]={plays:0,totalSec:0,artists:{},moods:{},days:{}};}

    function incPlay(s){
        var k=getSongKey(s.title,s.artist);
        playCounts[k]=(playCounts[k]||0)+1;savePC();
        if(currentUser){
            ensureStats();var u=userStats[currentUser];u.plays++;
            u.artists[s.artist]=(u.artists[s.artist]||0)+1;
            var mood=getSongMood(s);u.moods[mood]=(u.moods[mood]||0)+1;
            var d=['Min','Sen','Sel','Rab','Kam','Jum','Sab'][new Date().getDay()];
            u.days[d]=(u.days[d]||0)+1;saveStats();
            // Update collection stats
            updateCollectionStat('artist',s.artist);
            // Quest progress
            updateQuestProgress('plays',1);
            // Mood quest
            var qd=getQuestDate();
            if(!questProgress[qd])questProgress[qd]={};
            if(!questProgress[qd].moodSet)questProgress[qd].moodSet={};
            questProgress[qd].moodSet[mood]=true;
            var moodCount=Object.keys(questProgress[qd].moodSet).length;
            questProgress[qd].moods=moodCount;
            saveQuest();
            // Trending
            if(window.db){
                window.db.ref('trending/all/'+k.replace(/[.#$/\[\]]/g,'_')).transaction(function(val){
                    return{title:s.title,artist:s.artist,count:(val?val.count||0:0)+1};
                });
                var today=new Date().toISOString().split('T')[0];
                window.db.ref('trending/daily/'+today+'/'+k.replace(/[.#$/\[\]]/g,'_')).transaction(function(val){
                    return{title:s.title,artist:s.artist,count:(val?val.count||0:0)+1};
                });
            }
        }
    }

    function updateCollectionStat(type,name){
        if(!currentUser||!window.db)return;

            return{type:type,name:name,playCount:(val?val.playCount||0:0)+1,lastPlayed:new Date().toISOString()};
        });
    }

    // ===== QUEST SYSTEM =====
    function updateQuestProgress(field,amount){
        var qd=getQuestDate();
        if(!questProgress[qd])questProgress[qd]={};
        questProgress[qd][field]=(questProgress[qd][field]||0)+amount;
        saveQuest();
        checkQuestCompletion(field);
    }

    function checkQuestCompletion(field){
        var qd=getQuestDate();
        var qp=questProgress[qd]||{};
        DAILY_QUESTS.forEach(function(q){
            if(q.field===field){
                var val=qp[field]||0;
                var wasComplete=qp['done_'+q.id];
                if(val>=q.target&&!wasComplete){
                    questProgress[qd]['done_'+q.id]=true;
                    saveQuest();
                    addXP(q.xp);
                    showToast('🎯 Quest selesai: '+q.name+' (+'+q.xp+' XP)','info');
                }
            }
        });
    }

    function playSong(){if(currentTrackIndex===-1&&!currentTrackIsContrib){loadTrack(0);return;}isPlaying=true;setBuffering(true);var retryCount=0,maxRetry=3;function tryPlay(){currentAudio.play().then(function(){setBuffering(false);}).catch(function(){retryCount++;if(retryCount<maxRetry)setTimeout(tryPlay,retryCount*500);else{setBuffering(false);isPlaying=false;masterPlay.className='fa-solid fa-circle-play play-icon';document.getElementById('lyric-play').className='fa-solid fa-circle-play lyric-play-icon';showToast('Ketuk play untuk lanjut','warning');}});}tryPlay();}

    function nextTrack(){if(repeatMode==='one'){currentAudio.currentTime=0;currentAudio.play();return;}if(currentTrackIsContrib){var s=getContributedSongs(),ci=-1;for(var i=0;i<s.length;i++){if(s[i]._key===currentContribKey){ci=i;break;}}if(s.length&&ci>-1){if(shuffleMode)playContribByKey(s[Math.floor(Math.random()*s.length)]._key);else playContribByKey(s[(ci+1)%s.length]._key);}return;}if(shuffleMode)loadTrack(Math.floor(Math.random()*daftarLagu.length));else{var next=(currentTrackIndex+1)%daftarLagu.length;if(next===0&&repeatMode==='off'){pauseSong();return;}loadTrack(next);}}
    function prevTrack(){if(currentAudio.currentTime>3){currentAudio.currentTime=0;return;}if(currentTrackIsContrib){var s=getContributedSongs(),ci=-1;for(var i=0;i<s.length;i++){if(s[i]._key===currentContribKey){ci=i;break;}}if(s.length&&ci>-1)playContribByKey(s[(ci-1+s.length)%s.length]._key);return;}loadTrack((currentTrackIndex-1+daftarLagu.length)%daftarLagu.length);}

    currentAudio.addEventListener('ended',nextTrack);

    // ===== GOOGLE AUTH =====
    var googleProvider = new firebase.auth.GoogleAuthProvider();

    window.handleGoogleLogin = function() {
      firebase.auth().signInWithPopup(googleProvider).then(function(result) {
        var user = result.user;
        var username = user.displayName || user.email.split('@')[0];
        var email = user.email;

        // Check if user exists in localStorage
        var dbL = JSON.parse(localStorage.getItem('elltify_users') || '{}');
        
        // Find existing user by email
        var existingUser = null;
        Object.keys(dbL).forEach(function(u) {
          if (dbL[u].email && dbL[u].email.toLowerCase() === email.toLowerCase()) {
            existingUser = u;
          }
        });

        if (existingUser) {
          // Existing user - check ban
          if (dbL[existingUser].banned) {
            document.getElementById('login-banned').style.display = 'block';
            firebase.auth().signOut();
            return;
          }
          loginUser(existingUser);
        } else {
          // New user - register
          var safeUsername = username.replace(/[^a-zA-Z0-9_]/g, '');
          if (safeUsername.length < 3) safeUsername = 'user' + Date.now().toString().slice(-6);
          
          // Ensure unique username
          while (dbL[safeUsername]) {
            safeUsername = safeUsername + Math.floor(Math.random() * 100);
          }

          dbL[safeUsername] = {
            password: 'google-auth-' + Date.now(),
            email: email,
            favorites: [],
            customPlaylists: [],
            banned: false,
            googleUid: user.uid
          };
          localStorage.setItem('elltify_users', JSON.stringify(dbL));
          
          // Save to Firebase
          window.db.ref('users/' + safeUsername).set({
            username: safeUsername,
            email: email,
            googleUid: user.uid,
            createdAt: new Date().toISOString()
          });

          loginUser(safeUsername);
        }
      }).catch(function(error) {
        if (error.code === 'auth/popup-closed-by-user') return;
        if (error.code === 'auth/configuration-not-found') {
          showToast('Aktifkan Google Auth di Firebase Console', 'error');
          return;
        }
        showToast('Login gagal: ' + error.message, 'error');
      });
    };
